services:
  - type: web
    name: natty-language
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: "node server.js"
    envVars:
      # Values are set in the Render dashboard, never in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: TURNS_PER_IP_PER_HOUR
        value: "400"
      - key: TURNS_PER_DAY
        value: "4000"
